name: Renovate

# Mirrors the scheduled dependency-update job that previously ran on CircleCI.
# Requires a repository secret named `RENOVATE_TOKEN` (a GitHub PAT with
# `repo` scope). Alternatively, install the hosted Renovate GitHub App and
# delete this workflow.
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    if: github.repository == 'kogai/typed_i18n'
    steps:
      - uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.5
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: kogai/typed_i18n
